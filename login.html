<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Yasmin Beauty Salon | Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- ?v= busts the browser cache after an update: bump it on every release. -->
  <link rel="stylesheet" href="palette.css?v=20261015">
  <link rel="stylesheet" href="login.css?v=20261015">
  <script src="config.js?v=20261015" defer></script>
  <!-- Mocks: uncomment here AND in panel-view.html, and set USE_MOCKS = true in mock.js. -->
  <!-- <script src="mock.js?v=20261015" defer></script> -->
  <script src="login.js?v=20261015" defer></script>
</head>

<body>
  <main class="login-layout">
    <div class="login-column">
      <img src="images/logo-yasmin-vertical.svg" alt="Yasmin Beauty Salon" class="login-logo" width="210">

      <form id="login-form" class="login-card">
        <h1 class="login-title">Iniciar sesión</h1>

        <label for="email">Correo electrónico</label>
        <input type="text" id="email" name="email" autocomplete="username" inputmode="email" required
          placeholder="nombre@ejemplo.com" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}"
          title="Escribe un correo válido, por ejemplo nombre@ejemplo.com" aria-describedby="email-error">
        <p class="field-error" id="email-error" hidden>Escribe un correo válido, por ejemplo nombre@ejemplo.com.</p>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required
          placeholder="Tu contraseña">

        <!-- One element for both layouts: login.css floats it top right on desktop/iPad
             and leaves it in place (above the button) on phones. -->
        <div id="toast" class="toast" role="alert" hidden>
          <!-- Alert icon copied from the public site's failure modal -->
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="7.5" x2="12" y2="13"></line>
            <line x1="12" y1="16.5" x2="12" y2="16.5"></line>
          </svg>
          <span id="toast-text"></span>
        </div>

        <button type="submit" id="login-btn" class="login-btn">Entrar</button>
      </form>
    </div>
  </main>

  <footer class="login-footer">
    <span class="copyright">&copy; <span id="copyright-year"></span> Yasmin Beauty Salon</span>
  </footer>
</body>

</html>
